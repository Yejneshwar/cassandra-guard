name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    services:
      cassandra:
        image: cassandra:4.1
        ports:
          - 9042:9042
        env:
          CASSANDRA_CLUSTER_NAME: test-cluster
          CASSANDRA_DC: datacenter1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Cassandra to be ready
        run: |
          echo "Waiting for Cassandra to accept connections..."
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.cassandra.id }} cqlsh -e "DESCRIBE KEYSPACES" 2>/dev/null; then
              echo "Cassandra is ready!"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        env:
          CASSANDRA_HOST: 127.0.0.1
          CASSANDRA_PORT: 9042
          CASSANDRA_DATACENTER: datacenter1
        run: npm run test:integration

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please, integration-tests]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public

