name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Unit tests (no database required) ───────────────────────────────────────
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # ── Integration tests (real Cassandra) ──────────────────────────────────────
  integration-tests:
    name: Integration Tests (Cassandra 4.1)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      cassandra:
        image: cassandra:4.1
        ports:
          - 9042:9042
        env:
          CASSANDRA_CLUSTER_NAME: test-cluster
          CASSANDRA_DC: datacenter1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Cassandra to be ready
        run: |
          echo "Waiting for Cassandra to accept connections..."
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.cassandra.id }} cqlsh -e "DESCRIBE KEYSPACES" 2>/dev/null; then
              echo "Cassandra is ready!"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done

      - name: Run integration tests
        env:
          CASSANDRA_HOST: 127.0.0.1
          CASSANDRA_PORT: 9042
          CASSANDRA_DATACENTER: datacenter1
        run: npm run test:integration
